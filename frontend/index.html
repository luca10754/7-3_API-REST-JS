<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Estudiantes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <header>
    <h1>Registro de Estudiantes</h1>
    <p>Panel de administración conectado a Spring Boot API</p>
  </header>

  <!-- Formulario de creación -->
  <section class="card">
    <form id="studentForm">
      <div class="form-grid">
        <div class="input-group">
          <label for="firstName">Nombre</label>
          <input type="text" id="firstName" placeholder="Ej. Ana" required>
        </div>
        <div class="input-group">
          <label for="lastName">Apellido</label>
          <input type="text" id="lastName" placeholder="Ej. Pérez" required>
        </div>
        <div class="input-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" placeholder="ana@mail.com" required>
        </div>
        <div class="input-group">
          <label for="age">Edad</label>
          <input type="number" id="age" placeholder="20" min="1" max="120" required>
        </div>
      </div>
      <button type="submit" class="btn-submit">+ Guardar Estudiante</button>
    </form>
  </section>

  <!-- Lista de usuarios -->
  <section class="card">
    <div class="list-header">
      <h2>Estudiantes Registrados</h2>
      <span class="badge" id="userCount">0 registros</span>
    </div>
    <div id="userList" class="user-list">
      <div class="empty-state">Cargando estudiantes...</div>
    </div>
  </section>
</div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
